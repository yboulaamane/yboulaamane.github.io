<svg viewBox="0 0 780 470" width="780" height="470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#f8fafc"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">One seed is a single draw from a distribution</text>
  <text x="390" y="55" text-anchor="middle" font-size="12.5" fill="#64748b">Test-set performance across 30 UMAP+K-means seeds</text>

  <!-- plot frame -->
  <rect x="90" y="80" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- y axis -->
  <text x="40" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 40 240)">Test Pearson r</text>
  <g font-size="11" fill="#94a3b8">
    <text x="82" y="110" text-anchor="end">0.75</text>
    <text x="82" y="180" text-anchor="end">0.65</text>
    <text x="82" y="250" text-anchor="end">0.55</text>
    <text x="82" y="320" text-anchor="end">0.45</text>
    <text x="82" y="390" text-anchor="end">0.35</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="105" x2="690" y2="105"/>
    <line x1="90" y1="175" x2="690" y2="175"/>
    <line x1="90" y1="245" x2="690" y2="245"/>
    <line x1="90" y1="315" x2="690" y2="315"/>
    <line x1="90" y1="385" x2="690" y2="385"/>
  </g>

  <!-- mean band (mean ~0.60, +-2sd) -->
  <rect x="90" y="160" width="600" height="150" fill="#16a34a" opacity="0.08"/>
  <line x1="90" y1="235" x2="690" y2="235" stroke="#15803d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="680" y="228" text-anchor="end" font-size="11.5" font-weight="700" fill="#15803d">mean r = 0.60</text>
  <text x="680" y="305" text-anchor="end" font-size="10.5" fill="#16a34a">±2 SD</text>

  <!-- jittered seed points -->
  <g fill="#64748b" opacity="0.85">
    <circle cx="130" cy="250" r="5"/><circle cx="150" cy="210" r="5"/><circle cx="170" cy="275" r="5"/>
    <circle cx="195" cy="230" r="5"/><circle cx="215" cy="200" r="5"/><circle cx="240" cy="260" r="5"/>
    <circle cx="265" cy="240" r="5"/><circle cx="285" cy="285" r="5"/><circle cx="310" cy="215" r="5"/>
    <circle cx="335" cy="255" r="5"/><circle cx="360" cy="225" r="5"/><circle cx="385" cy="270" r="5"/>
    <circle cx="410" cy="205" r="5"/><circle cx="435" cy="245" r="5"/><circle cx="460" cy="290" r="5"/>
    <circle cx="485" cy="220" r="5"/><circle cx="510" cy="260" r="5"/><circle cx="535" cy="235" r="5"/>
    <circle cx="560" cy="280" r="5"/><circle cx="585" cy="210" r="5"/><circle cx="610" cy="250" r="5"/>
    <circle cx="635" cy="240" r="5"/><circle cx="190" cy="300" r="5"/><circle cx="420" cy="300" r="5"/>
    <circle cx="555" cy="195" r="5"/><circle cx="300" cy="195" r="5"/><circle cx="470" cy="255" r="5"/>
    <circle cx="245" cy="225" r="5"/><circle cx="640" cy="215" r="5"/>
  </g>

  <!-- seed 42 highlighted high -->
  <circle cx="350" cy="130" r="9" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="350" y1="130" x2="350" y2="105" stroke="#ef4444" stroke-width="1.5"/>
  <text x="350" y="100" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">seed 42 → r = 0.72</text>

  <!-- annotation -->
  <text x="390" y="432" text-anchor="middle" font-size="12.5" fill="#334155">Report r = 0.60 ± 0.06 over 30 seeds — not the cherry-pickable 0.72 from seed 42 alone.</text>
  <text x="390" y="452" text-anchor="middle" font-size="11" fill="#94a3b8">x-axis: seed index (jittered for visibility)</text>
</svg>
