<svg viewBox="0 0 920 560" width="920" height="560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <style>
      .card { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:14; }
      .num  { font-size:15px; font-weight:700; fill:#ffffff; }
      .title{ font-size:16px; font-weight:700; fill:#0f172a; }
      .sub  { font-size:12.5px; fill:#475569; }
      .tool { font-size:11.5px; font-weight:600; fill:#1d4ed8; }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">Ligand-Based 3D Pharmacophore Pipeline</text>
  <text x="460" y="62" text-anchor="middle" font-size="13.5" fill="#64748b">From raw PDB structures to a consensus feature map — entirely open source</text>

  <!-- Stage 1 -->
  <g>
    <rect class="card" x="40" y="95" width="380" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="72" cy="123" r="16" fill="#2563eb"/>
    <text x="72" y="128" text-anchor="middle" class="num">1</text>
    <text x="100" y="120" class="title">Mine the PDB</text>
    <text x="100" y="142" class="sub">Query by UniProt ID, filter on resolution,</text>
    <text x="100" y="159" class="sub">chains and a drug-like ligand (&gt;100 Da)</text>
    <text x="100" y="178" class="tool">biotite · RCSB GraphQL API</text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect class="card" x="500" y="95" width="380" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="532" cy="123" r="16" fill="#0891b2"/>
    <text x="532" y="128" text-anchor="middle" class="num">2</text>
    <text x="560" y="120" class="title">Extract &amp; align in 3D</text>
    <text x="560" y="142" class="sub">Split protein / ligand, superpose Cα</text>
    <text x="560" y="159" class="sub">backbones onto a reference structure</text>
    <text x="560" y="178" class="tool">MDAnalysis</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect class="card" x="40" y="237" width="380" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="72" cy="265" r="16" fill="#7c3aed"/>
    <text x="72" y="270" text-anchor="middle" class="num">3</text>
    <text x="100" y="262" class="title">Cluster binding sites</text>
    <text x="100" y="284" class="sub">DBSCAN on ligand coordinates to isolate</text>
    <text x="100" y="301" class="sub">the orthosteric "hot" pocket</text>
    <text x="100" y="320" class="tool">scikit-learn · DBSCAN</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect class="card" x="500" y="237" width="380" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="532" cy="265" r="16" fill="#db2777"/>
    <text x="532" y="270" text-anchor="middle" class="num">4</text>
    <text x="560" y="262" class="title">Fix bonds &amp; extract features</text>
    <text x="560" y="284" class="sub">Reassign bond orders from SMILES, then</text>
    <text x="560" y="301" class="sub">map donors, acceptors, aromatics, hydrophobes</text>
    <text x="560" y="320" class="tool">RDKit · rdFMCS · FeatureFactory</text>
  </g>

  <!-- Stage 5 -->
  <g>
    <rect class="card" x="270" y="379" width="380" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="302" cy="407" r="16" fill="#16a34a"/>
    <text x="302" y="412" text-anchor="middle" class="num">5</text>
    <text x="330" y="404" class="title">Build the consensus model</text>
    <text x="330" y="426" class="sub">k-means per feature type, drop low-frequency</text>
    <text x="330" y="443" class="sub">noise → essential shared coordinates</text>
    <text x="330" y="462" class="tool">scikit-learn · k-means</text>
  </g>

  <!-- Output -->
  <g>
    <rect x="310" y="500" width="300" height="44" rx="22" fill="#0f172a"/>
    <text x="460" y="528" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">3D pharmacophore → virtual screening 🚀</text>
  </g>

  <!-- arrows -->
  <path d="M420,141 L498,141" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M690,189 L690,235" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M498,283 L422,283" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M230,331 C230,355 380,360 458,381" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M460,471 L460,498" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
</svg>
