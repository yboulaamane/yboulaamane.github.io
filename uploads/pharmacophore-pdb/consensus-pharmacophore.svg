<svg viewBox="0 0 820 440" width="820" height="440" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="820" height="440" fill="#f8fafc"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">From scattered features to a consensus pharmacophore</text>
  <text x="410" y="56" text-anchor="middle" font-size="12.5" fill="#64748b">k-means collapses each feature type into its essential spatial centroid</text>

  <!-- scattered raw features (faint) -->
  <g opacity="0.35">
    <!-- acceptors red -->
    <circle cx="250" cy="150" r="6" fill="#ef4444"/><circle cx="262" cy="140" r="6" fill="#ef4444"/><circle cx="240" cy="162" r="6" fill="#ef4444"/><circle cx="258" cy="165" r="6" fill="#ef4444"/>
    <!-- donors blue -->
    <circle cx="430" cy="200" r="6" fill="#3b82f6"/><circle cx="442" cy="190" r="6" fill="#3b82f6"/><circle cx="420" cy="210" r="6" fill="#3b82f6"/>
    <!-- aromatic orange -->
    <circle cx="360" cy="300" r="6" fill="#f59e0b"/><circle cx="372" cy="290" r="6" fill="#f59e0b"/><circle cx="350" cy="310" r="6" fill="#f59e0b"/><circle cx="368" cy="312" r="6" fill="#f59e0b"/>
    <!-- hydrophobe green -->
    <circle cx="540" cy="300" r="6" fill="#10b981"/><circle cx="552" cy="290" r="6" fill="#10b981"/><circle cx="530" cy="312" r="6" fill="#10b981"/>
  </g>

  <!-- consensus centroids (bold, ringed) -->
  <g stroke-width="2.5">
    <circle cx="252" cy="154" r="15" fill="#ef4444" stroke="#991b1b"/>
    <text x="252" y="159" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">A</text>
    <circle cx="430" cy="200" r="15" fill="#3b82f6" stroke="#1e40af"/>
    <text x="430" y="205" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">D</text>
    <circle cx="360" cy="302" r="15" fill="#f59e0b" stroke="#92400e"/>
    <text x="360" y="307" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">Ar</text>
    <circle cx="540" cy="300" r="15" fill="#10b981" stroke="#065f46"/>
    <text x="540" y="305" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">H</text>
  </g>

  <!-- connecting geometry -->
  <g stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <line x1="252" y1="154" x2="430" y2="200"/>
    <line x1="430" y1="200" x2="540" y2="300"/>
    <line x1="540" y1="300" x2="360" y2="302"/>
    <line x1="360" y1="302" x2="252" y2="154"/>
  </g>

  <!-- legend -->
  <g font-size="12.5" fill="#334155">
    <circle cx="620" cy="120" r="9" fill="#ef4444"/><text x="638" y="125">H-bond Acceptor (A)</text>
    <circle cx="620" cy="150" r="9" fill="#3b82f6"/><text x="638" y="155">H-bond Donor (D)</text>
    <circle cx="620" cy="180" r="9" fill="#f59e0b"/><text x="638" y="185">Aromatic ring (Ar)</text>
    <circle cx="620" cy="210" r="9" fill="#10b981"/><text x="638" y="215">Hydrophobe (H)</text>
    <circle cx="620" cy="245" r="7" fill="#cbd5e1"/><text x="638" y="250" fill="#64748b">faint = raw per-ligand features</text>
    <circle cx="620" cy="272" r="9" fill="#64748b"/><text x="638" y="277" fill="#64748b">bold = consensus centroid</text>
  </g>

  <text x="410" y="410" text-anchor="middle" font-size="12" fill="#94a3b8">Distances between centroids define the geometric query used in screening</text>
</svg>
