<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="greenNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #111827; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #1F2937; text-anchor: middle; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
    .node-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .badge-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #FFFFFF; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="800" height="280" fill="#F9FAFB" rx="12" />

  <text x="30" y="30" class="title-text">Three Core GNN Prediction Tasks</text>

  <!-- Node Classification -->
  <g transform="translate(30, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label">Node Classification</text>
    <text x="110" y="42" class="sublabel">Predict properties of individual nodes</text>
    
    <!-- Graph -->
    <line x1="70" y1="120" x2="110" y2="80" stroke="#9CA3AF" stroke-width="2" />
    <line x1="70" y1="120" x2="110" y2="160" stroke="#9CA3AF" stroke-width="2" />
    <line x1="110" y1="80" x2="150" y2="120" stroke="#9CA3AF" stroke-width="2" />
    <line x1="110" y1="160" x2="150" y2="120" stroke="#9CA3AF" stroke-width="2" />

    <circle cx="70" cy="120" r="14" fill="url(#blueNode)" />
    <circle cx="110" cy="80" r="14" fill="url(#greenNode)" />
    <circle cx="110" cy="160" r="14" fill="url(#blueNode)" />
    
    <!-- Target node with classification bubble -->
    <circle cx="150" cy="120" r="16" fill="url(#blueNode)" stroke="#EF4444" stroke-width="2" />
    <text x="150" y="120" class="node-text">?</text>
    
    <!-- Classification result tag -->
    <rect x="110" y="145" width="80" height="22" rx="4" fill="#EF4444" />
    <text x="150" y="159" class="badge-text" font-size="10">Class: Active</text>
  </g>

  <!-- Link Prediction -->
  <g transform="translate(290, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label">Link Prediction</text>
    <text x="110" y="42" class="sublabel">Predict if edge should exist between nodes</text>
    
    <!-- Graph -->
    <line x1="60" y1="90" x2="110" y2="130" stroke="#9CA3AF" stroke-width="2" />
    <line x1="160" y1="90" x2="110" y2="130" stroke="#9CA3AF" stroke-width="2" />
    <line x1="60" y1="150" x2="110" y2="130" stroke="#9CA3AF" stroke-width="2" />

    <!-- Dotted prediction link -->
    <line x1="160" y1="150" x2="110" y2="130" stroke="#8B5CF6" stroke-width="3" stroke-dasharray="5 3" />

    <circle cx="60" cy="90" r="14" fill="url(#blueNode)" />
    <circle cx="60" cy="150" r="14" fill="url(#blueNode)" />
    <circle cx="110" cy="130" r="14" fill="url(#blueNode)" />
    <circle cx="160" cy="90" r="14" fill="url(#blueNode)" />
    <circle cx="160" cy="150" r="14" fill="url(#blueNode)" />

    <rect x="115" y="155" width="70" height="22" rx="4" fill="#8B5CF6" />
    <text x="150" y="169" class="badge-text" font-size="10">p(Edge) = 0.92</text>
  </g>

  <!-- Graph Classification -->
  <g transform="translate(550, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label">Graph Classification</text>
    <text x="110" y="42" class="sublabel">Pool all node features for whole-graph label</text>
    
    <!-- Miniature Graph -->
    <g transform="translate(15, 60)">
      <line x1="30" y1="30" x2="60" y2="15" stroke="#9CA3AF" stroke-width="1.5" />
      <line x1="30" y1="30" x2="60" y2="45" stroke="#9CA3AF" stroke-width="1.5" />
      <line x1="60" y1="15" x2="60" y2="45" stroke="#9CA3AF" stroke-width="1.5" />
      <circle cx="30" cy="30" r="8" fill="url(#blueNode)" />
      <circle cx="60" cy="15" r="8" fill="url(#blueNode)" />
      <circle cx="60" cy="45" r="8" fill="url(#blueNode)" />
    </g>

    <!-- Pooling indicator -->
    <path d="M 100 90 L 130 90" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="100" y="100" width="30" height="15" rx="3" fill="#E5E7EB" />
    <text x="115" y="111" font-family="Inter" font-size="9" fill="#374151" text-anchor="middle" font-weight="700">POOL</text>

    <!-- Pooled Vector -->
    <g transform="translate(145, 65)">
      <rect width="18" height="50" rx="2" fill="url(#purpleGrad)" />
      <line x1="0" y1="12" x2="18" y2="12" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="0" y1="25" x2="18" y2="25" stroke="#FFFFFF" stroke-width="1.5" />
      <line x1="0" y1="38" x2="18" y2="38" stroke="#FFFFFF" stroke-width="1.5" />
      <text x="35" y="30" font-family="Inter" font-size="10" fill="#6D28D9" font-weight="800">Vector</text>
    </g>

    <!-- Classification result tag -->
    <rect x="65" y="145" width="90" height="22" rx="4" fill="#10B981" />
    <text x="110" y="159" class="badge-text" font-size="10">Label: Mutagenic</text>
  </g>
</svg>
