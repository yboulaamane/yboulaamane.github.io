<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .node-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #1F2937; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #4B5563; }
    .title-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #111827; }
    .math-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #1E3A8A; }
  </style>

  <!-- Background -->
  <rect width="700" height="250" fill="#F9FAFB" rx="12" />

  <!-- Graph Drawing -->
  <g transform="translate(50, 20)">
    <text x="0" y="20" class="title-text">Graph Topology</text>
    
    <!-- Edges -->
    <line x1="80" y1="120" x2="180" y2="80" stroke="#9CA3AF" stroke-width="3" />
    <line x1="80" y1="120" x2="180" y2="160" stroke="#9CA3AF" stroke-width="3" />
    <line x1="180" y1="80" x2="180" y2="160" stroke="#9CA3AF" stroke-width="3" />
    <line x1="180" y1="80" x2="280" y2="120" stroke="#9CA3AF" stroke-width="3" />
    <line x1="180" y1="160" x2="280" y2="120" stroke="#9CA3AF" stroke-width="3" />
    
    <!-- Nodes -->
    <!-- Node A -->
    <circle cx="80" cy="120" r="24" fill="url(#nodeGrad)" filter="url(#shadow)" />
    <text x="80" y="120" class="node-text">A</text>
    
    <!-- Node B -->
    <circle cx="180" cy="80" r="24" fill="url(#nodeGrad)" filter="url(#shadow)" />
    <text x="180" y="80" class="node-text">B</text>

    <!-- Node C -->
    <circle cx="180" cy="160" r="24" fill="url(#nodeGrad)" filter="url(#shadow)" />
    <text x="180" y="160" class="node-text">C</text>

    <!-- Node D -->
    <circle cx="280" cy="120" r="24" fill="url(#nodeGrad)" filter="url(#shadow)" />
    <text x="280" y="120" class="node-text">D</text>
  </g>

  <!-- Explanatory Panel -->
  <g transform="translate(380, 40)">
    <text x="0" y="10" class="label">Graph Elements</text>
    <text x="0" y="30" class="sublabel">• Nodes (V) = {A, B, C, D} - Represent entities</text>
    <text x="0" y="50" class="sublabel">• Edges (E) = {(A,B), (A,C), (B,C), (B,D), (C,D)} - Connections</text>
    
    <text x="0" y="90" class="label">Degree &amp; Neighborhood</text>
    <text x="0" y="110" class="sublabel">• Degree: How many edges touch a node (e.g., Node B degree = 3)</text>
    <text x="0" y="130" class="sublabel">• Neighborhood: Directly connected nodes (e.g., N(A) = {B, C})</text>
    
    <text x="0" y="170" class="label">Adjacency Matrix (A)</text>
    <text x="0" y="190" class="math-text">A_ij = 1 if edge exists else 0</text>
  </g>
</svg>
