<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="sampledGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fadedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #111827; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #1F2937; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #4B5563; }
    .node-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .node-text-fade { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #9CA3AF; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Background -->
  <rect width="700" height="250" fill="#F9FAFB" rx="12" />

  <text x="30" y="30" class="title-text">Neighbor Sampling for Large-Scale Training</text>

  <!-- Graph Drawing -->
  <g transform="translate(50, 40)">
    <!-- Faded (unsampled) edges -->
    <line x1="120" y1="120" x2="60" y2="40" stroke="#E5E7EB" stroke-width="1.5" />
    <line x1="60" y1="40" x2="40" y2="100" stroke="#E5E7EB" stroke-width="1.5" />
    <line x1="120" y1="120" x2="220" y2="40" stroke="#E5E7EB" stroke-width="1.5" />
    
    <!-- Sampled edges (thick blue) -->
    <line x1="120" y1="120" x2="60" y2="160" stroke="#3B82F6" stroke-width="3" />
    <line x1="120" y1="120" x2="180" y2="160" stroke="#3B82F6" stroke-width="3" />
    
    <!-- Faded Nodes -->
    <circle cx="60" cy="40" r="16" fill="url(#fadedGrad)" stroke="#D1D5DB" stroke-width="1" />
    <text x="60" y="40" class="node-text-fade">u₃</text>
    
    <circle cx="40" cy="100" r="16" fill="url(#fadedGrad)" stroke="#D1D5DB" stroke-width="1" />
    <text x="40" y="100" class="node-text-fade">u₄</text>

    <circle cx="220" cy="40" r="16" fill="url(#fadedGrad)" stroke="#D1D5DB" stroke-width="1" />
    <text x="220" y="40" class="node-text-fade">u₅</text>

    <!-- Sampled Neighbors -->
    <circle cx="60" cy="160" r="18" fill="url(#sampledGrad)" filter="url(#shadow)" />
    <text x="60" y="160" class="node-text">u₁</text>

    <circle cx="180" cy="160" r="18" fill="url(#sampledGrad)" filter="url(#shadow)" />
    <text x="180" y="160" class="node-text">u₂</text>

    <!-- Target Node -->
    <circle cx="120" cy="120" r="22" fill="url(#targetGrad)" filter="url(#shadow)" stroke="#B91C1C" stroke-width="1.5" />
    <text x="120" y="120" class="node-text" font-size="12">Target</text>
  </g>

  <!-- Explanation Panel -->
  <g transform="translate(350, 60)">
    <text x="0" y="15" class="label">How it works:</text>
    <text x="0" y="40" class="sublabel">• Mini-batching raw graphs is hard due to dependencies.</text>
    <text x="0" y="65" class="sublabel">• Solution: Sample a small, fixed number of neighbors</text>
    <text x="10" y="85" class="sublabel">per node (e.g. sample size = 2).</text>
    <text x="0" y="110" class="sublabel">• Unsampled nodes (<tspan fill="#9CA3AF" font-weight="700">u₃, u₄, u₅</tspan>) and their edges are ignored.</text>
    <text x="0" y="135" class="sublabel">• This bounds memory size and allows GPU mini-batch training</text>
    <text x="10" y="155" class="sublabel">on graphs with billions of nodes.</text>
  </g>
</svg>
