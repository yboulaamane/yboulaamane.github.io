<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="hop1Node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="hop2Node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fadeNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <!-- Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #111827; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #1F2937; text-anchor: middle; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
    .node-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .node-text-dark { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #4B5563; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Background -->
  <rect width="800" height="280" fill="#F9FAFB" rx="12" />

  <text x="30" y="30" class="title-text">GNN Layer Stacking: Receptive Field &amp; Over-smoothing</text>

  <!-- 1-Hop Receptive Field -->
  <g transform="translate(30, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label">1-Hop (Layer 1)</text>
    <text x="110" y="42" class="sublabel">Can see direct neighbors</text>
    
    <!-- Graph -->
    <!-- Edges -->
    <line x1="110" y1="120" x2="60" y2="90" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="60" y2="150" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="160" y2="90" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="160" y2="150" stroke="#9CA3AF" stroke-width="1.5" />
    <!-- 2-hop edges (inactive) -->
    <line x1="60" y1="90" x2="20" y2="120" stroke="#E5E7EB" stroke-width="1.5" />
    <line x1="160" y1="90" x2="200" y2="120" stroke="#E5E7EB" stroke-width="1.5" />

    <!-- Nodes -->
    <!-- Outer unreached -->
    <circle cx="20" cy="120" r="12" fill="url(#fadeNode)" />
    <text x="20" y="120" class="node-text-dark">w₁</text>
    <circle cx="200" cy="120" r="12" fill="url(#fadeNode)" />
    <text x="200" y="120" class="node-text-dark">w₂</text>

    <!-- 1-hop active -->
    <circle cx="60" cy="90" r="12" fill="url(#hop1Node)" />
    <text x="60" y="90" class="node-text">u₁</text>
    <circle cx="60" cy="150" r="12" fill="url(#hop1Node)" />
    <text x="60" y="150" class="node-text">u₂</text>
    <circle cx="160" cy="90" r="12" fill="url(#hop1Node)" />
    <text x="160" y="90" class="node-text">u₃</text>
    <circle cx="160" cy="150" r="12" fill="url(#hop1Node)" />
    <text x="160" y="150" class="node-text">u₄</text>

    <!-- Target Node -->
    <circle cx="110" cy="120" r="15" fill="url(#primaryNode)" />
    <text x="110" y="120" class="node-text">v</text>
  </g>

  <!-- 2-Hop Receptive Field -->
  <g transform="translate(290, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label">2-Hop (Layer 2)</text>
    <text x="110" y="42" class="sublabel">Can see neighbors' neighbors</text>
    
    <!-- Graph -->
    <!-- Edges -->
    <line x1="110" y1="120" x2="60" y2="90" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="60" y2="150" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="160" y2="90" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="110" y1="120" x2="160" y2="150" stroke="#9CA3AF" stroke-width="1.5" />
    <!-- 2-hop edges (active) -->
    <line x1="60" y1="90" x2="20" y2="120" stroke="#9CA3AF" stroke-width="1.5" />
    <line x1="160" y1="90" x2="200" y2="120" stroke="#9CA3AF" stroke-width="1.5" />

    <!-- Nodes -->
    <!-- 2-hop active -->
    <circle cx="20" cy="120" r="12" fill="url(#hop2Node)" />
    <text x="20" y="120" class="node-text">w₁</text>
    <circle cx="200" cy="120" r="12" fill="url(#hop2Node)" />
    <text x="200" y="120" class="node-text">w₂</text>

    <!-- 1-hop active -->
    <circle cx="60" cy="90" r="12" fill="url(#hop1Node)" />
    <text x="60" y="90" class="node-text">u₁</text>
    <circle cx="60" cy="150" r="12" fill="url(#hop1Node)" />
    <text x="60" y="150" class="node-text">u₂</text>
    <circle cx="160" cy="90" r="12" fill="url(#hop1Node)" />
    <text x="160" y="90" class="node-text">u₃</text>
    <circle cx="160" cy="150" r="12" fill="url(#hop1Node)" />
    <text x="160" y="150" class="node-text">u₄</text>

    <!-- Target Node -->
    <circle cx="110" cy="120" r="15" fill="url(#primaryNode)" />
    <text x="110" y="120" class="node-text">v</text>
  </g>

  <!-- Over-smoothing Alert -->
  <g transform="translate(550, 50)">
    <rect width="220" height="200" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" filter="url(#shadow)" />
    <text x="110" y="25" class="label" fill="#92400E">K-Hop (Over-smoothing)</text>
    <text x="110" y="42" class="sublabel" fill="#B45309">Too many layers = representations merge</text>
    
    <!-- Over-smoothed Graph: all nodes turn green/yellow -->
    <g transform="translate(10, 50)">
      <line x1="100" y1="70" x2="50" y2="40" stroke="#FBBF24" stroke-width="1.5" />
      <line x1="100" y1="70" x2="50" y2="100" stroke="#FBBF24" stroke-width="1.5" />
      <line x1="100" y1="70" x2="150" y2="40" stroke="#FBBF24" stroke-width="1.5" />
      <line x1="100" y1="70" x2="150" y2="100" stroke="#FBBF24" stroke-width="1.5" />
      <line x1="50" y1="40" x2="10" y2="70" stroke="#FBBF24" stroke-width="1.5" />
      <line x1="150" y1="40" x2="190" y2="70" stroke="#FBBF24" stroke-width="1.5" />

      <circle cx="10" cy="70" r="10" fill="#FBBF24" />
      <circle cx="190" cy="70" r="10" fill="#FBBF24" />
      <circle cx="50" cy="40" r="10" fill="#FBBF24" />
      <circle cx="50" cy="100" r="10" fill="#FBBF24" />
      <circle cx="150" cy="40" r="10" fill="#FBBF24" />
      <circle cx="150" cy="100" r="10" fill="#FBBF24" />
      <circle cx="100" cy="70" r="12" fill="#F59E0B" />
      
      <text x="100" y="125" font-family="Inter" font-size="11" fill="#78350F" font-weight="700" text-anchor="middle">All nodes look identical!</text>
    </g>
  </g>
</svg>
