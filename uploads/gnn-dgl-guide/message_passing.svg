<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="msgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    
    <!-- Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981" />
    </marker>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: #111827; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #1F2937; text-anchor: middle; }
    .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #4B5563; text-anchor: middle; }
    .node-label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
    .math-text { font-family: 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #374151; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect width="800" height="280" fill="#F9FAFB" rx="12" />

  <text x="30" y="30" class="title-text">GNN Layer Message Passing Recipe</text>

  <!-- Step 1: Send Messages -->
  <g transform="translate(30, 50)">
    <rect width="210" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="105" y="25" class="label">1. Message Step</text>
    <text x="105" y="42" class="sublabel">Neighbors send features along edges</text>
    
    <!-- Nodes -->
    <circle cx="50" cy="90" r="16" fill="url(#nodeGrad)" />
    <text x="50" y="90" class="node-label">u₁</text>
    
    <circle cx="50" cy="150" r="16" fill="url(#nodeGrad)" />
    <text x="50" y="150" class="node-label">u₂</text>
    
    <circle cx="160" cy="120" r="20" fill="url(#targetGrad)" />
    <text x="160" y="120" class="node-label">v</text>

    <!-- Message Arrows -->
    <path d="M 68 98 L 138 114" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 68 142 L 138 126" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow)" />
    
    <text x="105" y="90" font-family="Inter" font-size="10" fill="#6D28D9" font-weight="700">msg₁</text>
    <text x="105" y="160" font-family="Inter" font-size="10" fill="#6D28D9" font-weight="700">msg₂</text>
  </g>

  <!-- Connector Arrow -->
  <path d="M 260 150 L 285 150" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Step 2: Aggregate -->
  <g transform="translate(295, 50)">
    <rect width="210" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="105" y="25" class="label">2. Aggregate Step</text>
    <text x="105" y="42" class="sublabel">Collect &amp; combine (sum/mean/max)</text>

    <!-- Aggregator box -->
    <rect x="75" y="95" width="60" height="50" rx="6" fill="url(#msgGrad)" />
    <text x="105" y="120" font-family="Inter" font-size="20" fill="#FFFFFF" font-weight="bold" text-anchor="middle" dominant-baseline="central">∑</text>
    
    <!-- Arrows in -->
    <path d="M 35 110 L 70 115" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M 35 130 L 70 125" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow)" />
    
    <!-- Arrow out -->
    <path d="M 140 120 L 175 120" fill="none" stroke="#8B5CF6" stroke-width="2.5" marker-end="url(#arrow)" />
    
    <text x="105" y="175" class="math-text">m_v = Aggregate({msg})</text>
  </g>

  <!-- Connector Arrow -->
  <path d="M 525 150 L 550 150" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Step 3: Update -->
  <g transform="translate(560, 50)">
    <rect width="210" height="200" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadow)" />
    <text x="105" y="25" class="label">3. Update Step</text>
    <text x="105" y="42" class="sublabel">Compute new target representation</text>

    <!-- Target Node -->
    <circle cx="105" cy="100" r="22" fill="url(#targetGrad)" />
    <text x="105" y="100" class="node-label">v</text>
    
    <text x="105" y="150" class="math-text">h_v^(l) = Update(h_v^(l-1), m_v)</text>
    <text x="105" y="175" font-family="Inter" font-size="11" fill="#047857" font-weight="700">Updated Feature!</text>
  </g>
</svg>
