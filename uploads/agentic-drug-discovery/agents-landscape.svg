<svg viewBox="0 0 860 480" width="860" height="480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="480" fill="#f8fafc"/>
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Five open-source agents at a glance</text>
  <text x="430" y="57" text-anchor="middle" font-size="12.5" fill="#64748b">Coloured by their primary design pattern</text>

  <!-- legend -->
  <g font-size="11.5" fill="#475569">
    <rect x="120" y="72" width="13" height="13" rx="3" fill="#2563eb"/><text x="140" y="83">Multi-agent + RAG</text>
    <rect x="300" y="72" width="13" height="13" rx="3" fill="#7c3aed"/><text x="320" y="83">Planner / executor</text>
    <rect x="480" y="72" width="13" height="13" rx="3" fill="#16a34a"/><text x="500" y="83">MCP server / tools</text>
    <rect x="640" y="72" width="13" height="13" rx="3" fill="#0891b2"/><text x="660" y="83">Skill library</text>
  </g>

  <!-- cards -->
  <!-- CLADD -->
  <g>
    <rect x="40" y="110" width="380" height="78" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="58" y="138" font-size="15" font-weight="800" fill="#1d4ed8">CLADD</text>
    <text x="58" y="158" font-size="11.5" fill="#475569">Multi-agent RAG that grounds LLMs in</text>
    <text x="58" y="174" font-size="11.5" fill="#475569">biochemical DBs — toxicity &amp; affinity, no fine-tuning</text>
    <text x="402" y="138" text-anchor="end" font-size="10.5" fill="#94a3b8">Genentech</text>
  </g>
  <!-- AgentD -->
  <g>
    <rect x="440" y="110" width="380" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <text x="458" y="138" font-size="15" font-weight="800" fill="#15803d">AgentD</text>
    <text x="458" y="158" font-size="11.5" fill="#475569">End-to-end design + screening + SMILES refinement;</text>
    <text x="458" y="174" font-size="11.5" fill="#475569">Lipinski/Veber filters, Boltz 3D, runs as MCP server</text>
    <text x="802" y="138" text-anchor="end" font-size="10.5" fill="#94a3b8">hoon-ock</text>
  </g>
  <!-- DrugAgent -->
  <g>
    <rect x="40" y="200" width="380" height="78" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="58" y="228" font-size="15" font-weight="800" fill="#6d28d9">DrugAgent</text>
    <text x="58" y="248" font-size="11.5" fill="#475569">Planner agent sets strategy; instructor agent</text>
    <text x="58" y="264" font-size="11.5" fill="#475569">writes executable Python for ADMET tasks</text>
    <text x="402" y="228" text-anchor="end" font-size="10.5" fill="#94a3b8">FermiQ</text>
  </g>
  <!-- DEDA -->
  <g>
    <rect x="440" y="200" width="380" height="78" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
    <text x="458" y="228" font-size="15" font-weight="800" fill="#15803d">DEDA</text>
    <text x="458" y="248" font-size="11.5" fill="#475569">Local MCP assistant — plain-English queries to</text>
    <text x="458" y="264" font-size="11.5" fill="#475569">UniProt/AlphaFold, real-time pocket mapping</text>
    <text x="802" y="228" text-anchor="end" font-size="10.5" fill="#94a3b8">drug-discovery-ai</text>
  </g>
  <!-- Scientific Agent Skills -->
  <g>
    <rect x="240" y="290" width="380" height="78" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="1.8"/>
    <text x="258" y="318" font-size="15" font-weight="800" fill="#0e7490">Scientific Agent Skills</text>
    <text x="258" y="338" font-size="11.5" fill="#475569">140+ skills wiring any LLM to 70+ databases:</text>
    <text x="258" y="354" font-size="11.5" fill="#475569">MD, genomics, docking</text>
    <text x="602" y="318" text-anchor="end" font-size="10.5" fill="#94a3b8">K-Dense-AI</text>
  </g>

  <text x="430" y="408" text-anchor="middle" font-size="12.5" fill="#64748b">Common thread: the LLM is a controller that reasons over specialised tools —</text>
  <text x="430" y="427" text-anchor="middle" font-size="12.5" fill="#64748b">it is not the model doing the chemistry.</text>
  <text x="430" y="458" text-anchor="middle" font-size="11" fill="#94a3b8">Verify repository URLs and licenses before relying on any tool in production.</text>
</svg>
