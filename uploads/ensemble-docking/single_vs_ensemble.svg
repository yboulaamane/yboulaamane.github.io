<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="grayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 18px; fill: #1F2937; }
    .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #6B7280; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #374151; }
    .desc { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #4B5563; }
    .badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #FFFFFF; }
    .card-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="350" fill="#F9FAFB" rx="12" />

  <!-- Left Panel: Single Structure -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <rect width="320" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <rect width="320" height="8" rx="4" fill="url(#grayGrad)" />
    
    <text x="20" y="35" class="card-title" fill="#374151">Single-Structure Docking</text>
    <text x="20" y="55" class="subtitle">Standard static approach</text>
    
    <!-- Cartoon Protein Structure -->
    <g transform="translate(40, 80)">
      <path d="M 20 60 C 20 20, 80 20, 100 50 C 120 80, 180 40, 200 80 C 220 120, 160 160, 110 130 C 60 100, 20 100, 20 60 Z" 
            fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 2" />
      <path d="M 90 70 C 110 50, 130 90, 150 70" fill="none" stroke="#EF4444" stroke-width="3" />
      <text x="95" y="100" class="label" fill="#EF4444">Active Site</text>
    </g>

    <!-- Bullet points -->
    <circle cx="30" cy="215" r="3" fill="#9CA3AF" />
    <text x="42" y="219" class="desc">Uses a single crystal structure (PDB)</text>
    
    <circle cx="30" cy="235" r="3" fill="#9CA3AF" />
    <text x="42" y="239" class="desc">Ignores target flexibility &amp; loop dynamics</text>
    
    <circle cx="30" cy="255" r="3" fill="#EF4444" />
    <text x="42" y="259" class="desc" font-weight="bold">Biased towards co-crystallized ligand</text>
  </g>

  <!-- Right Panel: Ensemble Docking -->
  <g transform="translate(440, 40)" filter="url(#shadow)">
    <rect width="320" height="270" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    <rect width="320" height="8" rx="4" fill="url(#blueGrad)" />
    
    <text x="20" y="35" class="card-title" fill="#4F46E5">Ensemble Docking</text>
    <text x="20" y="55" class="subtitle">Dynamic conformational approach</text>
    
    <!-- Three small overlapping proteins representing snapshots -->
    <g transform="translate(40, 80)">
      <!-- Conformer 1 -->
      <path d="M 10 50 C 10 20, 60 10, 80 40 C 100 70, 150 30, 170 70 C 190 110, 130 140, 90 110 C 50 80, 10 90, 10 50 Z" 
            fill="#EEF2F6" stroke="#A5B4FC" stroke-width="1.5" opacity="0.6" />
      
      <!-- Conformer 2 -->
      <path d="M 25 65 C 25 35, 75 15, 95 45 C 115 75, 165 45, 185 85 C 205 125, 145 145, 105 125 C 65 105, 25 95, 25 65 Z" 
            fill="#E0E7FF" stroke="#818CF8" stroke-width="1.5" opacity="0.8" />
            
      <!-- Conformer 3 (Top/Main) -->
      <path d="M 40 60 C 40 20, 90 20, 110 50 C 130 80, 180 50, 200 90 C 220 130, 160 150, 120 120 C 70 90, 40 100, 40 60 Z" 
            fill="url(#blueGrad)" fill-opacity="0.15" stroke="url(#blueGrad)" stroke-width="2.5" />
      
      <!-- Docked Ligand snapshots -->
      <path d="M 95 65 L 110 80 L 125 70" fill="none" stroke="#4F46E5" stroke-width="3" />
      <path d="M 98 75 L 112 85 L 130 75" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.7" />
      <path d="M 92 60 L 105 72 L 120 62" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.7" />
      
      <text x="85" y="115" class="label" fill="#4F46E5" font-size="11">MD Conformations</text>
    </g>

    <!-- Bullet points -->
    <circle cx="30" cy="215" r="3" fill="#4F46E5" />
    <text x="42" y="219" class="desc">Extracts snapshots from MD trajectories</text>
    
    <circle cx="30" cy="235" r="3" fill="#4F46E5" />
    <text x="42" y="239" class="desc">Captures multiple open/closed active states</text>
    
    <circle cx="30" cy="255" r="3" fill="#06B6D4" />
    <text x="42" y="259" class="desc" font-weight="bold">Yields statistical distribution of scores</text>
  </g>
</svg>
