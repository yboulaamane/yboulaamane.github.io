<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <!-- Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 16px; fill: #1F2937; }
    .label { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .text-num { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 16px; fill: rgba(255, 255, 255, 0.4); }
    .desc { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #4B5563; font-weight: 500; }
    .header-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 20px; fill: #111827; }
  </style>

  <!-- Background -->
  <rect width="850" height="400" fill="#F9FAFB" rx="12" />

  <text x="30" y="35" class="header-text">Integrated Ensemble Docking &amp; ML Workflow</text>

  <!-- ROW 1 (Steps 1-4) -->
  <!-- Step 1 -->
  <g transform="translate(30, 70)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">01</text>
    <text x="15" y="55" class="label">MD / GaMD</text>
    <text x="15" y="75" class="label">Sampling</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Conformational sampling</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 210 125 L 240 125" fill="none" stroke="#A5B4FC" stroke-width="3" marker-end="url(#arrow)" />
  
  <!-- Step 2 -->
  <g transform="translate(250, 70)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">02</text>
    <text x="15" y="55" class="label">BitQT Clustering</text>
    <text x="15" y="75" class="label">representative frames</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Reduce dimensionality</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 430 125 L 460 125" fill="none" stroke="#A5B4FC" stroke-width="3" />

  <!-- Step 3 -->
  <g transform="translate(470, 70)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">03</text>
    <text x="15" y="55" class="label">Ensemble Docking</text>
    <text x="15" y="75" class="label">multiple conformers</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Dock ligand to snapshot set</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 650 125 L 680 125" fill="none" stroke="#A5B4FC" stroke-width="3" />

  <!-- Step 4 -->
  <g transform="translate(690, 70)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">04</text>
    <text x="15" y="55" class="label">Interaction FPs</text>
    <text x="15" y="75" class="label">(PLEC / BINANA)</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Convert poses to features</text>
  </g>

  <!-- Arrow 4 -> 5 (Zigzag down) -->
  <path d="M 775 190 L 775 220 L 80 220 L 80 240" fill="none" stroke="#A5B4FC" stroke-dasharray="4 4" stroke-width="2" />

  <!-- ROW 2 (Steps 5-8) -->
  <!-- Step 5 -->
  <g transform="translate(30, 250)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">05</text>
    <text x="15" y="55" class="label">QM/MM Calculations</text>
    <text x="15" y="75" class="label">(MoBioTools + ORCA)</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">On selected snapshots only</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 210 305 L 240 305" fill="none" stroke="#A5B4FC" stroke-width="3" />

  <!-- Step 6 -->
  <g transform="translate(250, 250)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">06</text>
    <text x="15" y="55" class="label">Descriptors</text>
    <text x="15" y="75" class="label">&amp; Embeddings</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">SMILES, Boltz, Protein LMs</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 430 305 L 460 305" fill="none" stroke="#A5B4FC" stroke-width="3" />

  <!-- Step 7 -->
  <g transform="translate(470, 250)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">07</text>
    <text x="15" y="55" class="label">ML Model</text>
    <text x="15" y="75" class="label">(Binding / Activity)</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Predict binding and activity</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 650 305 L 680 305" fill="none" stroke="#A5B4FC" stroke-width="3" />

  <!-- Step 8 -->
  <g transform="translate(690, 250)" filter="url(#shadow)">
    <rect width="170" height="110" rx="8" fill="url(#stepGrad)" />
    <text x="15" y="30" class="text-num">08</text>
    <text x="15" y="55" class="label">Refinement</text>
    <text x="15" y="75" class="label">(MMPBSA + QM)</text>
    <rect x="0" y="90" width="170" height="20" rx="0" fill="#312E81" opacity="0.3" />
    <text x="15" y="104" font-family="Inter" font-size="10" fill="#E0E7FF">Refining top candidate hits</text>
  </g>

  <!-- Arrow marker definition -->
  <svg>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5B4FC" />
      </marker>
    </defs>
  </svg>
</svg>
