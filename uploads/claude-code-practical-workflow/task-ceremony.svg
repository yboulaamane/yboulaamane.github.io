<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img">
<style>
.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.ts{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#73726c}
.th{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.box{fill:#faf9f5;stroke:#b4b2a9}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-amber rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.t,.th{fill:#c2c0b6}.ts{fill:#9c9a92}
.box{fill:#2b2a27;stroke:#5F5E5A}
.arr{stroke:#9c9a92}
.c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}
.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
.c-amber rect,rect.c-amber{fill:#633806;stroke:#EF9F27}
.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Choosing how much process a Claude Code task needs</title><desc>A decision tree. Start with a new task. If the scope is not clear and bounded, use plan mode first and approve before editing; if it is, implement directly. Then ask whether Claude can verify the result. If not, build the check first using tests, types or a browser. If it can, let it iterate through run, observe and revise.</desc>
<rect class="box" x="280" y="30" width="120" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">New task</text>
<line x1="340" y1="74" x2="340" y2="94" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="220" y="100" width="240" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central">Scope clear and bounded?</text>
<path d="M340 144 L340 170 L140 170 L140 190" class="arr" marker-end="url(#arrow)"/>
<path d="M340 144 L340 170 L540 170 L540 190" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="152" y="188">no</text>
<text class="ts" x="552" y="188">yes</text>
<g class="c-teal"><rect x="50" y="196" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="216" text-anchor="middle" dominant-baseline="central">Plan mode first</text><text class="ts" x="140" y="236" text-anchor="middle" dominant-baseline="central">approve before editing</text></g>
<g class="c-teal"><rect x="450" y="196" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="216" text-anchor="middle" dominant-baseline="central">Implement directly</text><text class="ts" x="540" y="236" text-anchor="middle" dominant-baseline="central">small, well-defined</text></g>
<path d="M140 252 L140 276 L340 276" class="arr"/>
<path d="M540 252 L540 276 L340 276" class="arr"/>
<line x1="340" y1="276" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="200" y="296" width="280" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="318" text-anchor="middle" dominant-baseline="central">Can Claude verify the result?</text>
<path d="M340 340 L340 366 L140 366 L140 386" class="arr" marker-end="url(#arrow)"/>
<path d="M340 340 L340 366 L540 366 L540 386" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="152" y="384">no</text>
<text class="ts" x="552" y="384">yes</text>
<g class="c-teal"><rect x="50" y="392" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="140" y="412" text-anchor="middle" dominant-baseline="central">Build the check first</text><text class="ts" x="140" y="432" text-anchor="middle" dominant-baseline="central">tests, types, browser</text></g>
<g class="c-teal"><rect x="450" y="392" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="540" y="412" text-anchor="middle" dominant-baseline="central">Let it iterate</text><text class="ts" x="540" y="432" text-anchor="middle" dominant-baseline="central">run, observe, revise</text></g>
</svg>
