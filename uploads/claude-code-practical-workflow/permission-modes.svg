<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 210" role="img">
<style>
.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.ts{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#73726c}
.th{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.box{fill:#faf9f5;stroke:#b4b2a9}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-amber rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.t,.th{fill:#c2c0b6}.ts{fill:#9c9a92}
.box{fill:#2b2a27;stroke:#5F5E5A}
.arr{stroke:#9c9a92}
.c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}
.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
.c-amber rect,rect.c-amber{fill:#633806;stroke:#EF9F27}
.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>Claude Code permission mode cycle</title><desc>Shift plus Tab cycles through four modes in order: default which always prompts, acceptEdits where file edits pass automatically, plan where no edits are made, and auto where a classifier gates each action. Auto is opt-in and only appears once enabled.</desc>
<g class="c-gray"><rect x="40" y="50" width="128" height="56" rx="8" stroke-width="0.5"/><text class="th" x="104" y="70" text-anchor="middle" dominant-baseline="central">default</text><text class="ts" x="104" y="90" text-anchor="middle" dominant-baseline="central">always prompts</text></g>
<g class="c-gray"><rect x="197" y="50" width="128" height="56" rx="8" stroke-width="0.5"/><text class="th" x="261" y="70" text-anchor="middle" dominant-baseline="central">acceptEdits</text><text class="ts" x="261" y="90" text-anchor="middle" dominant-baseline="central">edits auto-pass</text></g>
<g class="c-gray"><rect x="354" y="50" width="128" height="56" rx="8" stroke-width="0.5"/><text class="th" x="418" y="70" text-anchor="middle" dominant-baseline="central">plan</text><text class="ts" x="418" y="90" text-anchor="middle" dominant-baseline="central">no edits made</text></g>
<g class="c-amber"><rect x="511" y="50" width="128" height="56" rx="8" stroke-width="0.5"/><text class="th" x="575" y="70" text-anchor="middle" dominant-baseline="central">auto</text><text class="ts" x="575" y="90" text-anchor="middle" dominant-baseline="central">auto-gated</text></g>
<line x1="168" y1="78" x2="191" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="325" y1="78" x2="348" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="482" y1="78" x2="505" y2="78" class="arr" marker-end="url(#arrow)"/>
<path d="M575 106 L575 146 L104 146 L104 112" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="168" text-anchor="middle">Shift+Tab steps through the cycle</text>
<rect class="c-amber" x="248" y="188" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="264" y="197">opt-in, absent until enabled</text>
</svg>
