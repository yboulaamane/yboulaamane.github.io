<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 220" role="img">
<style>
.t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.ts{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#73726c}
.th{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.box{fill:#faf9f5;stroke:#b4b2a9}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
.c-purple rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-teal rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-gray rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#444441}.c-gray .ts{fill:#5F5E5A}
.c-amber rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B}
.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
@media (prefers-color-scheme:dark){
.t,.th{fill:#c2c0b6}.ts{fill:#9c9a92}
.box{fill:#2b2a27;stroke:#5F5E5A}
.arr{stroke:#9c9a92}
.c-purple rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC}
.c-purple .th{fill:#CECBF6}.c-purple .ts{fill:#AFA9EC}
.c-teal rect,rect.c-teal{fill:#085041;stroke:#5DCAA5}
.c-teal .th{fill:#9FE1CB}.c-teal .ts{fill:#5DCAA5}
.c-gray rect,rect.c-gray{fill:#444441;stroke:#B4B2A9}
.c-gray .th{fill:#D3D1C7}.c-gray .ts{fill:#B4B2A9}
.c-amber rect,rect.c-amber{fill:#633806;stroke:#EF9F27}
.c-amber .th{fill:#FAC775}.c-amber .ts{fill:#EF9F27}
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>The verification loop in Claude Code</title><desc>Five stages, implement, run, observe, diagnose and revise, connected left to right with a return arrow from revise back to implement. Implement and revise are generation steps, observe and diagnose are verification steps.</desc>
<g class="c-purple"><rect x="40" y="60" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="88" y="82" text-anchor="middle" dominant-baseline="central">Implement</text></g>
<g class="c-gray"><rect x="166" y="60" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="214" y="82" text-anchor="middle" dominant-baseline="central">Run</text></g>
<g class="c-teal"><rect x="292" y="60" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="82" text-anchor="middle" dominant-baseline="central">Observe</text></g>
<g class="c-teal"><rect x="418" y="60" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="466" y="82" text-anchor="middle" dominant-baseline="central">Diagnose</text></g>
<g class="c-purple"><rect x="544" y="60" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="592" y="82" text-anchor="middle" dominant-baseline="central">Revise</text></g>
<line x1="136" y1="82" x2="160" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="262" y1="82" x2="286" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="388" y1="82" x2="412" y2="82" class="arr" marker-end="url(#arrow)"/>
<line x1="514" y1="82" x2="538" y2="82" class="arr" marker-end="url(#arrow)"/>
<path d="M592 104 L592 144 L88 144 L88 110" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="166" text-anchor="middle">Repeats until the checks pass</text>
<rect class="c-purple" x="250" y="186" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="266" y="195">generate</text>
<rect class="c-teal" x="370" y="186" width="10" height="10" rx="2" stroke-width="0.5"/>
<text class="ts" x="386" y="195">verify</text>
</svg>
